body:
  - type: markdown
    attributes:
      value: |
        Her yayın için moderatörler sabitlenmiş bir **"📺 Yayın Soruları — <tarih>"** başlığı açar. Sorunu o başlığa **yorum** olarak yazman en iyisi.
        Yayınla ilgili olmayan, kendi başına bir konuysa bu formu kullan.
  - type: textarea
    id: soru
    attributes:
      label: Sorun
    validations:
      required: true
  - type: input
    id: yayin
    attributes:
      label: Hangi yayın / video?
      placeholder: "22 Kasım canlı yayını ya da video linki"
  - type: textarea
    id: ek
    attributes:
      label: Ekran görüntüsü / bağlam (opsiyonel)
  - type: checkboxes
    id: izin
    attributes:
      label: Yayın
      options:
        - label: Sorum yayında kullanıcı adımla birlikte ekranda gösterilebilir.
