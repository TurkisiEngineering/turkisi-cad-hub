body:
  - type: dropdown
    id: tur
    attributes:
      label: Tür
      options:
        - İş ilanı
        - Freelance proje
        - İş / proje arıyorum
        - Proje ortağı arıyorum
    validations:
      required: true
  - type: textarea
    id: aciklama
    attributes:
      label: Açıklama
      description: Kapsam, araçlar, süre, uzaktan/yerinde.
    validations:
      required: true
  - type: input
    id: butce
    attributes:
      label: Bütçe / ücret aralığı (opsiyonel)
  - type: input
    id: iletisim
    attributes:
      label: İletişim
      description: Kişisel telefon yerine LinkedIn / Upwork / iş e-postası önerilir.
    validations:
      required: true
  - type: checkboxes
    id: kapsam
    attributes:
      label: Kurallar
      options:
        - label: Paylaşım CAD / agentic CAD ile ilgili ve reklam/spam değil.
          required: true
