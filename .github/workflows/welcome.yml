name: kumpas-welcome

# Yeni başlıklara KUMPAS ağzından kısa bir karşılama/yönlendirme yorumu bırakır.
# Kategori slug'ları community/categories.yml ile aynı olmalı (gerçek slug'ları kontrol et).
on:
  discussion:
    types: [created]

permissions:
  discussions: write
  contents: read

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const d = context.payload.discussion;
            const slug = d.category && d.category.slug;
            const author = d.user && d.user.login;

            // Moderatör başlıklarına yorum yapma
            const maintainers = ["mikbalarikan"];
            maintainers.push("Olmustur");
            if (maintainers.includes(author)) return;

            const hub = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const messages = {
              "merhaba":
                `🤖 **KUMPAS:** Hoş geldin @${author}! 📏\n\n` +
                `- Takıldığın bir şey olursa → [Soru-Cevap](${hub}/discussions/categories/soru-cevap)\n` +
                `- Bir şey ürettiysen → [Projelerimiz](${hub}/discussions/categories/projelerimiz)\n` +
                `- Kendini sınamak istersen → [Lig](${hub}/discussions/categories/lig)\n\n` +
                `Bildirim almak için: sağ üst **Watch → Custom → Discussions**.`,
              "soru-cevap":
                `🤖 **KUMPAS:** Sorun kayda geçti @${author}. 📏\n\n` +
                `Hata logu ve ortam bilgisi (CAD sürümü, agent/model) eklediysen cevap daha hızlı gelir. ` +
                `Çözüldüğünde işe yarayan yanıtı **Mark as answer** ile işaretlemeyi unutma.`,
              "projelerimiz":
                `🤖 **KUMPAS:** Ölçtük, kaydettik. 📏 Paylaştığın için teşekkürler @${author}!\n\n` +
                `Sapma / feature sayısı / döngü gibi ölçüler eklediysen başkaları kendi sonuçlarını seninkiyle karşılaştırabilir.`,
              "lig":
                `🤖 **KUMPAS:** Lig masasına hoş geldin @${author}. 🏁\n\n` +
                `Sonucunu [lig reposunda issue olarak](https://github.com/TurkisiEngineering/turkisi-cad/issues/new) paylaş: config, sürümler, koşu kaydı ve puan dosyası. *Ölçmeden onay yok.*`
            };

            const body = messages[slug];
            if (!body) return;

            await github.graphql(
              `mutation($id: ID!, $body: String!) {
                 addDiscussionComment(input: {discussionId: $id, body: $body}) { comment { id } }
               }`,
              { id: d.node_id, body }
            );
