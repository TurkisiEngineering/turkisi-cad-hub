name: bridge-sync

# README'deki "Ekip" ve "Projeler" bölümlerini community/members.yml'den yeniden üretir.
on:
  schedule:
    - cron: "17 3 * * *"        # her gün 03:17 UTC (06:17 Riyad / İstanbul)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - community/members.yml
      - scripts/build_bridge.py

permissions:
  contents: write

concurrency:
  group: bridge-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install pyyaml==6.0.2

      - name: Build bridge sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_bridge.py --readme README.md --members community/members.yml

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README değişmedi."
            exit 0
          fi
          git config user.name "kumpas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(bridge): proje listesini güncelle"
          git push
